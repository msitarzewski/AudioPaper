# gitleaks configuration for AudioPaper.
# Uses the default ruleset. API keys belong in the Keychain (app) or a git-ignored .env (apctl) —
# never in source, fixtures, or screenshots.
[extend]
useDefault = true

# AGENTS.md's troubleshooting table says "Token limit approaching", which the generic-api-key rule
# reads as a token assignment. It's prose, not a secret.
[[allowlists]]
description = "AGENTS.md prose about context token limits"
paths = ['''^AGENTS\.md$''']
regexTarget = "match"
regexes = ['''Token limit approaching''']

# Sparkle's EdDSA *public* key: published on purpose, so the app can verify updates. It can't sign
# anything; the private half lives only in the maintainer's Keychain. Allowlisted by exact value.
[[allowlists]]
description = "Sparkle public update-verification key"
paths = ['''^project\.yml$''']
regexTarget = "match"
regexes = ['''SUPublicEDKey: lpSHxqLs3q81a7t2g8ZlsO67NTszfgArJdvd4kO/hbA=''']
