name: AudioPaper
options:
  bundleIdPrefix: com.audiopaper
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AudioPaperKit:
    path: Packages/AudioPaperKit
  # Sparkle auto-update (github.com/sparkle-project/Sparkle), as in Anomalous. The one third-party
  # dependency, deliberately: macOS has no updater for apps distributed outside the Mac App Store.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.4"
targets:
  AudioPaper:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - AppIcon.icon
      # Icon Composer document; Xcode compiles it into the asset catalog.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: AudioPaperKit
        product: AudioPaperKit
      - package: Sparkle
        product: Sparkle
      - target: AudioPaperWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AudioPaper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Widget clicks open the Mini Player through this scheme (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.audiopaper
            CFBundleURLSchemes:
              - audiopaper
        # Shared with the widget extension; must match the application-groups entitlement.
        AudioPaperAppGroup: $(DEVELOPMENT_TEAM).com.audiopaper
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: true
        NSAppleEventsUsageDescription: AudioPaper asks Music what is playing when it starts, so your wallpaper matches right away.
        NSHumanReadableCopyright: ""
        # fanart.tv project key, supplied only by scripts/release.sh (never committed). Empty in other builds,
        # which then need a key in Settings → Accounts.
        FanartTVProjectKey: $(FANART_PROJECT_KEY)
        # ── Sparkle auto-update ──────────────────────────────────────────
        # The feed is published with the website (site/static/appcast.xml) by scripts/release.sh.
        SUFeedURL: $(SPARKLE_FEED_URL)
        # Updates must be signed with the matching private key, kept in the maintainer's login Keychain
        # (generate_keys --account AudioPaper). This public half is safe to publish.
        SUPublicEDKey: lpSHxqLs3q81a7t2g8ZlsO67NTszfgArJdvd4kO/hbA=
        # A sandboxed app hands installation to Sparkle's installer launcher (see the entitlements below).
        SUEnableInstallerLauncherService: true
        # No SUEnableAutomaticChecks: Sparkle asks on the second launch whether to check automatically,
        # so people choose. No system profile is ever sent.
    entitlements:
      path: App/AudioPaper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Required under the hardened runtime for the launch-time "what's playing?" query to Music.
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.Music
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).com.audiopaper
        # Sparkle's installer launcher and its status channel, reachable from the sandbox (Sparkle's
        # sandboxing guide). Nothing else is opened up.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiopaper
        CODE_SIGN_STYLE: Automatic
        # Contributors: override with your own team, or build with CODE_SIGNING_ALLOWED=NO (see CONTRIBUTING.md).
        DEVELOPMENT_TEAM: 7JQGQ7CRH8
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        FANART_PROJECT_KEY: ""
        # Overridden only to test updates against a local feed.
        SPARKLE_FEED_URL: https://msitarzewski.github.io/AudioPaper/appcast.xml

  AudioPaperWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
    dependencies:
      - package: AudioPaperKit
        product: AudioPaperKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AudioPaper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AudioPaperAppGroup: $(DEVELOPMENT_TEAM).com.audiopaper
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AudioPaperWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(DEVELOPMENT_TEAM).com.audiopaper
        # Sparkle's installer launcher and its status channel, reachable from the sandbox (Sparkle's
        # sandboxing guide). Nothing else is opened up.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audiopaper.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7JQGQ7CRH8
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
